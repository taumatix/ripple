name: release

# A pushed tag vX.Y.Z publishes: a multi-arch image on GHCR (version tag, digest in the job
# summary and the release notes), static binaries attached to the GitHub release, and then
# installs the published artifacts from scratch and runs `ripple version`.
#
# Dry runs (nothing is pushed, no release is created):
#   - a pull request that touches this file, the Dockerfile or the smoke test builds
#     everything for the latest existing tag;
#   - workflow_dispatch with publish=false (the default) does the same for any existing tag.
# workflow_dispatch with publish=true re-runs the real publication for an existing tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - .dockerignore
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to build, e.g. v0.2.0
        required: true
      publish:
        description: Push the image and upload release assets (false is a dry run)
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)              version=$REF_NAME; publish=true ;;
            workflow_dispatch) version=$INPUT_VERSION; publish=$INPUT_PUBLISH ;;
            *)                 version=$(git describe --tags --abbrev=0 --match 'v[0-9]*'); publish=false ;;
          esac
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a release version: $version" >&2; exit 1
          fi
          git rev-parse -q --verify "refs/tags/$version" >/dev/null || { echo "tag $version does not exist" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release $version, publish=$publish ($EVENT)" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # `go install module@version` is how users get ripple, so the binary reports the tag
      # whatever state the checkout is in. GOPROXY=direct and GONOSUMDB avoid a fresh tag
      # racing the module proxy and the checksum database.
      - name: build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GOPROXY: direct
          GONOSUMDB: github.com/taumatix/ripple
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/gobin" go install -trimpath -ldflags="-s -w" "github.com/taumatix/ripple/cmd/ripple@$VERSION"
          exe=$(find "$RUNNER_TEMP/gobin" -type f -name 'ripple*')
          name="ripple_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          cp "$exe" LICENSE README.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
          rm -r "$name"
          sha256sum "$name".tar.gz "$name".zip 2>/dev/null > "$name.sha256" || true
          test -s "$name.sha256"
      - name: the linux/amd64 binary reports the tag
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          tar -xzf "dist/ripple_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          got=$("$RUNNER_TEMP/ripple_${VERSION}_linux_amd64/ripple" version)
          test "$got" = "ripple $VERSION" || { echo "got '$got', want 'ripple $VERSION'" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        # A real release builds the tag's own Dockerfile; a dry run builds the Dockerfile under review.
        with:
          ref: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.version || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          set -euo pipefail
          # GHCR wants a lowercase repository path.
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.meta.outputs.image }}:${{ needs.prepare.outputs.version }}
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A multi-arch build cannot be loaded; load the runner's own architecture to run it.
      - name: dry run, the image reports the tag
        if: needs.prepare.outputs.publish != 'true'
        run: |
          set -euo pipefail
          docker buildx build --load --build-arg "VERSION=$VERSION" -t ripple:dry .
          got=$(docker run --rm ripple:dry version)
          test "$got" = "ripple $VERSION" || { echo "got '$got', want 'ripple $VERSION'" >&2; exit 1; }
          echo "dry run: image builds for linux/amd64,linux/arm64 and reports '$got'; nothing pushed" >> "$GITHUB_STEP_SUMMARY"
      - name: published digest
        if: needs.prepare.outputs.publish == 'true'
        run: |
          echo "image ${{ steps.meta.outputs.image }}:$VERSION digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [prepare, binaries, image]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: create or update the GitHub release
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS
          rm dist/*.sha256
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          # Notes: the CHANGELOG section for this version, then where to install from.
          awk -v v="${VERSION#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo '- `go install github.com/taumatix/ripple/cmd/ripple@'"$VERSION"'`'
            echo '- Static binaries below (SHA256SUMS lists their checksums).'
            echo '- Container image (linux/amd64, linux/arm64): `docker pull '"$image:$VERSION"'`, pinned by digest `'"$image@$DIGEST"'`. The package must be public for an unauthenticated pull.'
          } >> notes.md
          pre=""; case "$VERSION" in *-*) pre="--prerelease" ;; esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --verify-tag --title "$VERSION" --notes-file notes.md $pre
          fi

  verify:
    needs: [prepare, image, release]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      # No checkout: this installs the way a user would, from nothing.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: go install path
        env:
          GOBIN: ${{ runner.temp }}/gobin
          GOPROXY: direct
          GONOSUMDB: github.com/taumatix/ripple
        run: |
          set -euo pipefail
          go install "github.com/taumatix/ripple/cmd/ripple@$VERSION"
          got=$("$GOBIN/ripple" version)
          test "$got" = "ripple $VERSION" || { echo "go install: got '$got'" >&2; exit 1; }
          echo "go install ...@$VERSION -> '$got'" >> "$GITHUB_STEP_SUMMARY"
      - name: published binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "ripple_${VERSION}_linux_amd64.tar.gz" --pattern SHA256SUMS
          grep "ripple_${VERSION}_linux_amd64.tar.gz" SHA256SUMS | sha256sum -c -
          tar -xzf "ripple_${VERSION}_linux_amd64.tar.gz"
          got=$("./ripple_${VERSION}_linux_amd64/ripple" version)
          test "$got" = "ripple $VERSION" || { echo "release binary: got '$got'" >&2; exit 1; }
          echo "release binary linux/amd64 -> '$got'" >> "$GITHUB_STEP_SUMMARY"
      - name: published image, anonymous pull (is the package public yet?)
        id: anon
        continue-on-error: true
        run: |
          set -euo pipefail
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker logout ghcr.io || true
          docker pull "$image@$DIGEST"
      - name: published image, authenticated pull and run
        run: |
          set -euo pipefail
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker image rm "$image@$DIGEST" 2>/dev/null || true
          docker pull "$image@$DIGEST"
          got=$(docker run --rm "$image@$DIGEST" version)
          test "$got" = "ripple $VERSION" || { echo "image: got '$got'" >&2; exit 1; }
          echo "image $image@$DIGEST -> '$got'" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.anon.outcome }}" = success ]; then
            echo "The package is public: anonymous pulls work." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The GHCR package is still private: anonymous docker pull fails. A maintainer must set its visibility to public once in the GitHub UI (there is no API); until then go install is the open install path."
            echo "The package is NOT public yet: anonymous pulls fail." >> "$GITHUB_STEP_SUMMARY"
          fi

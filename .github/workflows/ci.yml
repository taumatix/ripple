name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ripple
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      dynamodb:
        image: amazon/dynamodb-local
        ports: ["8000:8000"]
    env:
      RIPPLE_REQUIRE_SERVICES: "1"
      RIPPLE_TEST_POSTGRES_DSN: postgres://postgres:ripple@localhost:5432/postgres?sslmode=disable
      RIPPLE_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: scripts/check-migration.sh
      - name: test (fails if the service-backed tests were skipped)
        run: go test -race -count=1 -v ./... | tee test.log
      - run: |
          # RIPPLE_REQUIRE_SERVICES already fails a skipped service test; this catches any other skip.
          # The image smoke test skips here by design: the docker job runs it against the built image.
          if grep -E -- '--- SKIP' test.log | grep -v -- 'TestRippleOpensExactlyOnePR'; then echo "tests were skipped"; exit 1; fi
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker build -t ripple:ci .
      - run: docker run --rm ripple:ci config example
      # The built image serves webhooks over HTTP against a fake GitHub: one signed push event and
      # one new release must end in exactly one pull request.
      - name: smoke test the image
        run: RIPPLE_SMOKE_IMAGE=ripple:ci go test -count=1 -v ./internal/smoke/

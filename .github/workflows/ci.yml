name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ripple
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      dynamodb:
        image: amazon/dynamodb-local
        ports: ["8000:8000"]
    env:
      RIPPLE_REQUIRE_SERVICES: "1"
      RIPPLE_TEST_POSTGRES_DSN: postgres://postgres:ripple@localhost:5432/postgres?sslmode=disable
      RIPPLE_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: scripts/check-migration.sh
      - name: test (fails if the service-backed tests were skipped)
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -v ./... | tee test.log
      - run: |
          # RIPPLE_REQUIRE_SERVICES already fails a skipped service test; this catches any other skip.
          # The image smoke test skips here by design: the docker job runs it against the built image.
          if grep -E -- '--- SKIP' test.log | grep -v -- 'TestRippleOpensExactlyOnePR'; then echo "tests were skipped"; exit 1; fi
      - name: dynamofake agrees with DynamoDB Local
        run: |
          scripts/check-dynamo-parity.sh --self-test
          scripts/check-dynamo-parity.sh test.log
  e2e-repeat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ripple
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      dynamodb:
        image: amazon/dynamodb-local
        ports: ["8000:8000"]
    env:
      RIPPLE_REQUIRE_SERVICES: "1"
      RIPPLE_TEST_POSTGRES_DSN: postgres://postgres:ripple@localhost:5432/postgres?sslmode=disable
      RIPPLE_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: e2e suite twice in one process (finds order dependence and leftover state)
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=2 -v -timeout 30m ./internal/e2e/ | tee e2e.log
      - run: |
          if grep -E -- '--- SKIP' e2e.log | grep -v -- 'TestRippleOpensExactlyOnePR'; then echo "tests were skipped"; exit 1; fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker build -t ripple:ci .
      - run: docker run --rm ripple:ci config example
      # The built image serves webhooks over HTTP against a fake GitHub: one signed push event and
      # one new release must end in exactly one pull request.
      - name: smoke test the image
        run: RIPPLE_SMOKE_IMAGE=ripple:ci go test -count=1 -v ./internal/smoke/
  # The container runners against a real daemon: the same live test the Apple runner has, plus the
  # confined network (internal network and a proxy sidecar). It needs a registry and proxy.golang.org.
  container-runtimes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: runtime version
        run: ${{ matrix.runtime }} version
      - name: live container tests
        env:
          RIPPLE_TEST_CONTAINER_FLAVOUR: ${{ matrix.runtime }}
        run: |
          set -o pipefail
          go test -tags containerlive -count=1 -v -timeout 20m -run 'TestContainerRuntimeLive|TestContainerConfinedNetworkLive' ./internal/sandbox/ | tee live.log
      - name: build the runner image (git and a pinned Go)
        run: ${{ matrix.runtime }} build -t localhost/ripple-runner:ci -f docker/runner/Dockerfile docker/runner
      - name: build a runner image per Go minor (RIPPLE_CONTAINER_GO_IMAGES)
        run: |
          set -e
          for minor in 1.26 1.27; do
            ${{ matrix.runtime }} build --build-arg GO_VERSION=$minor -t localhost/ripple-runner:$minor -f docker/runner/Dockerfile docker/runner
            v=$(${{ matrix.runtime }} run --rm localhost/ripple-runner:$minor go version)
            echo "$v"
            case "$v" in *" go$minor"*) ;; *) echo "image for $minor runs: $v"; exit 1;; esac
            ${{ matrix.runtime }} run --rm localhost/ripple-runner:$minor git --version
          done
      - name: live container tests on the runner image and the server's wiring
        env:
          RIPPLE_TEST_CONTAINER_FLAVOUR: ${{ matrix.runtime }}
          RIPPLE_TEST_CONTAINER_IMAGE: localhost/ripple-runner:ci
        run: |
          set -o pipefail
          go test -tags containerlive -count=1 -v -timeout 20m -run 'TestContainerRuntimeLive|TestContainerConfinedNetworkLive|TestContainerGitLive|TestServerConfinesContainerNetworkLive|TestServerConfineSurvivesAKilledServer' ./internal/sandbox/ ./internal/app/ | tee live-runner.log
      - name: no skipped test
        run: "! grep -E -- '--- SKIP' live.log live-runner.log"

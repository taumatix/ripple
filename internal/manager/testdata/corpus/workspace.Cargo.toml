[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
exclude = ["crates/old"]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5.4", features = ["derive", "env"] }
regex = "1.10"
thiserror = "1"
once_cell = "1.19.0"
my-core = { path = "crates/core", version = "0.9.0" }
git-dep = { git = "https://github.com/example/git-dep", rev = "abc123" }
alt = { version = "2", registry = "internal" }
star = "*"
renamed = { package = "real-name", version = "0.5" }

[workspace.lints.clippy]
all = "warn"

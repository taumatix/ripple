[package]
name = "member"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "A \"quoted\" description with # a hash and [brackets]"

[lib]
name = "member"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
tokio = { workspace = true, features = ["rt"] }
serde_derive = { version = "=1.0.203", optional = true, path = "../serde_derive" }
log = { version = "0.4", features = ["std", "serde"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
chrono = {version="0.4.38",default-features=false,features=["clock"]}
uuid = { version = ">=1.8, <1.10", features = ["v4"] }
hyper = "^1.3"
rustls = "~0.23.5"
exact = "=0.1.0"
beta = "1.0.0-beta.2"
plus = "1.2.3+build.5"
gt = ">1.0"
or-pair = ">=1.0, <1.5"

[build-dependencies]
cc = "1.0"
bindgen = { version = "0.69.4", default-features = false, features = ["runtime"] }

[dev-dependencies.criterion]
version = "0.5"
features = ["html_reports"]

[[bench]]
name = "b"
harness = false

[patch.crates-io]
log = { git = "https://github.com/rust-lang/log" }
ignored = { version = "9.9.9" }

[badges]
maintenance = { status = "actively-developed" }

name: realtool
# Each job applies ripple's edit to a small real project under internal/manager/testdata/realtool and
# runs that ecosystem's own tool on the result (docs/realtool.md). A missing tool fails the job.
on:
  pull_request:
    paths:
      - "internal/manager/**"
      - "scripts/realtool.sh"
      - ".github/workflows/realtool.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
jobs:
  gomod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/realtool.sh TestRealtoolGoMod
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/realtool.sh TestRealtoolCargo
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: scripts/realtool.sh TestRealtoolNpm
  pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/realtool.sh TestRealtoolPip
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - run: scripts/realtool.sh TestRealtoolHelm
  bundler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: scripts/realtool.sh TestRealtoolBundler
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
      - run: scripts/realtool.sh TestRealtoolComposer
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: scripts/realtool.sh TestRealtoolNuget
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: scripts/realtool.sh TestRealtoolMaven
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: scripts/realtool.sh TestRealtoolTerraform
  github-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: scripts/realtool.sh TestRealtoolGitHubActions
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: "install hadolint (a linter, no Docker daemon is used)"
        run: |
          curl -fsSL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
      - run: scripts/realtool.sh TestRealtoolDocker

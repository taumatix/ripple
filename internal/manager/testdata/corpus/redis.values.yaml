## Global Docker image parameters
global:
  imageRegistry: ""
  imagePullSecrets: []
  redis:
    password: ""

## Bitnami Redis(R) image version
image:
  registry: docker.io
  repository: bitnami/redis
  tag: 7.2.5-debian-12-r4
  digest: ""
  pullPolicy: IfNotPresent
  debug: false

sentinel:
  enabled: false
  image:
    registry: docker.io
    repository: bitnami/redis-sentinel
    tag: 7.2.5-debian-12-r3
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
    pullPolicy: IfNotPresent

metrics:
  enabled: false
  image:
    registry: docker.io
    repository: bitnami/redis-exporter
    tag: 1.61.0-debian-12-r1
    digest: ""
  serviceMonitor:
    enabled: false
    interval: 30s

volumePermissions:
  image:
    registry: docker.io
    repository: bitnami/os-shell
    tag: 12-debian-12-r22

kubectl:
  image:
    registry: docker.io
    repository: bitnami/kubectl
    tag: 1.30.1-debian-12-r4
